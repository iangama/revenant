[workspace]
members = [
    "runtime/activities",
    "runtime/actors",
    "runtime/ai",
    "runtime/combat",
    "runtime/compatibility",
    "runtime/gateway",
    "runtime/identity",
    "runtime/objectives",
    "runtime/persistence",
    "runtime/protocol",
    "runtime/replay",
    "runtime/world",
    "tools/revenant",
    "archive/clients/v1",
    "tools/reconstruction-server",
    "tools/fake-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
postgres = "0.19.10"
