name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://revenant:revenant_local@127.0.0.1:5432/revenant
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revenant
          POSTGRES_USER: revenant
          POSTGRES_PASSWORD: revenant_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revenant -d revenant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/control-panel/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Validate version consistency
        run: |
          bash scripts/check-version.sh
          echo "RELEASE_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Audit repository for secrets
        run: bash scripts/audit-secrets.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Build Inspector
        run: |
          npm --prefix web/control-panel ci
          npm --prefix web/control-panel run check
          npm --prefix web/control-panel run build
      - name: Install Godot
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Smoke
        run: bash tests/smoke.sh
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Package release
        run: bash scripts/release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/release"
      - name: Verify clean extraction
        run: |
          mkdir "$RUNNER_TEMP/install"
          tar -xzf "$RUNNER_TEMP/release/revenant-$RELEASE_VERSION-linux-x86_64.tar.gz" \
            -C "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install/revenant-$RELEASE_VERSION-linux-x86_64"
          sha256sum --check SHA256SUMS
          reconstruction_log="$RUNNER_TEMP/reconstruction.log"
          REVENANT_RECONSTRUCTION_ADDR=127.0.0.1:17016 \
            bin/revenant-reconstructed-v1 >"$reconstruction_log" 2>&1 &
          reconstruction_pid=$!
          trap 'kill "$reconstruction_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            if grep -q 'listening' "$reconstruction_log"; then
              break
            fi
            sleep 0.1
          done
          REVENANT_GAME_ADDR=127.0.0.1:17016 bin/revenant-client-v1
          wait "$reconstruction_pid"
          grep -q 'without revenant-gateway' "$reconstruction_log"
      - uses: actions/upload-artifact@v6
        with:
          name: revenant-${{ env.RELEASE_VERSION }}-linux-x86_64
          path: |
            ${{ runner.temp }}/release/revenant-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
            ${{ runner.temp }}/release/revenant-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
