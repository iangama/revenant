map "$http_origin|$http_sec_fetch_site" $revenant_inspector_origin {
    default $http_origin;
    "|same-origin" "$scheme://$http_host";
}

server {
    listen 80;
    server_name _;
    access_log off;
    error_log /dev/null;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $revenant_inspector_origin;
    }

    location / {
        try_files $uri /index.html;
    }
}
